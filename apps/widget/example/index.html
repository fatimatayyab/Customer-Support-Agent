<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Third-party host site (simulated)</title>
  </head>
  <body>
    <h1 style="font-family: system-ui; padding: 20px">
      This is a stand-in for an arbitrary customer's website that has embedded the AI Customer Support widget.
    </h1>

    <!-- This is the actual embed snippet a real customer would paste, apiKey included -
         that's the real integration contract, not a local-dev convenience. Left blank
         here on purpose: without apiKey set, the widget prompts for one on-page and
         remembers it in this browser, so this file works unmodified too. To embed for
         real, generate a key from the dashboard (Home -> API Keys) and set it below. -->
    <script>
      window.CSAWidgetConfig = {
        apiUrl: "http://localhost:4000",
      };
    </script>
    <script src="/dist/widget.js"></script>
  </body>
</html>
